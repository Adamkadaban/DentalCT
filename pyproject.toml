[project]
name = "dentalct"
version = "0.1.0"
description = "Reader/visualizer for Carestream CS 8100 3D CBCT (CS 3D Imaging export)"
requires-python = ">=3.10"
dependencies = [
    "pydicom>=3.0",
    "pylibjpeg",
    "pylibjpeg-libjpeg",
    "numpy>=1.24",
]

[project.scripts]
dentalct-server = "dentalct.server:main"
dentalct-build = "dentalct.loader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dentalct"]
